<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
        }

        .auth-container {
            background-color: white;
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: 0.2s ease;
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        h2 {
            color: #2c3e50;
            text-align: center;
        }

        h5 {
            text-align: center;
            color: #555;
            margin-top: -10px;
            margin-bottom: 25px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        a {
            text-decoration: none;
            color: #2980b9;
            font-weight: bold;
        }

        .link-text {
            text-align: center;
        }

        .welcome-text {
            text-align: center;
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 42px;
            text-align: center;
            margin-bottom: 10px;
        }

        * {
            box-sizing: border-box;
        }

        .password-field {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .password-field input {
            width: 100%;
            padding-right: 50px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: #555;
            padding: 0;
            margin: 0;
        }

        .toggle-password:hover {
            color: #000;
        }
        
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="logo">🛡️</div>
        <h2>Phishing Detection System</h2>
        <h5>AI-Powered Email Threat Detection</h5>
        <p class="welcome-text">
            Welcome back! Log in to analyze suspicious emails, review previous scan results, and access your security dashboard.
        </p>

        <form action="/login" method="post">
            Username:<br>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label>Password:</label>
            <div class="password-field">
                <input type="password" id="login_password" name="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('login_password', this)">
                    👁
                </button>
            </div>

            <input type="submit" value="Login">
        </form>

        <p class="link-text">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>
<script>
    function togglePassword(inputId, buttonElement) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            buttonElement.textContent = "🙈";
        } else {
            input.type = "password";
            buttonElement.textContent = "👁";
        }
    }
</script>
</body>
</html>
